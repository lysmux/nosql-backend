name: delivery

services:
  riak:
    image: registry.dc.lysmux.dev/cicd/riak-kv:3.4.1
    hostname: riak
    environment:
      RIAK_NODENAME: riak@riak
      RIAK_DISTRIBUTED_COOKIE: cookie
    ports:
      - "8087:8087"
      - "8098:8098"
    volumes:
      - riak_data:/opt/riak/data
      - ./docker/riak/listeners.conf:/etc/riak/conf.d/listeners.conf:ro
      - ./docker/riak/init-bucket-types.sh:/usr/local/bin/init-bucket-types.sh:ro
    post_start:
      - command: sh /usr/local/bin/init-bucket-types.sh
    healthcheck:
      test: ["CMD-SHELL", "USE_NODETOOL=false riak eval 'riak_core_bucket_type:status(<<\"counters\">>).' | grep -qx active"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
  mongo:
    image: mongo:9
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-replica-set.sh:/usr/local/bin/init-replica-set.sh:ro
    post_start:
      - command: sh /usr/local/bin/init-replica-set.sh
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().isWritablePrimary ? quit(0) : quit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  riak_data:
  mongo_data:
