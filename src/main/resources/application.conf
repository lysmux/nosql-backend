server {
  port = 8080
}

app {
  assignment {
    enabled = true
    interval = PT5S
  }

  cache {
    catalog {
      ttl = PT1M
    }

    menu {
      ttl = PT1M
    }
  }

  session {
    ttl = PT30M
  }

  riak {
    timeout = PT2S

    nodes = [
      "1.riak.dc.lysmux.dev:8087"
      "2.riak.dc.lysmux.dev:8087"
      "3.riak.dc.lysmux.dev:8087"
    ]
    # Comma-separated in the environment, e.g. RIAK_NODES=host-1:8087,host-2:8087
    nodes = ${?RIAK_NODES}
  }
}

spring {
  datasource {
    url = "jdbc:postgresql://localhost:5432/delivery"
    url = ${?POSTGRES_URL}

    username = "app"
    username = ${?POSTGRES_USER}

    password = "password"
    password = ${?POSTGRES_PASSWORD}
  }

  jpa {
    hibernate {
      ddl-auto = "validate"
    }

    open-in-view = false

    properties {
      hibernate {
        generate_statistics = true
      }
    }
  }
}

management {
  server {
    port = 8081
  }

  endpoints {
    web {
      exposure {
        "include" = ["health", "metrics", "prometheus"]
      }
    }
  }

  metrics {
    distribution {
      percentiles-histogram {
        http.server.requests = true
        riak.requests = true
      }
    }

    data.repository.autotime.percentiles-histogram = true
  }
}
