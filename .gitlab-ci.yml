include:
  - component: $CI_SERVER_FQDN/cicd/templates/buildkit@1.3.0
    inputs:
      job_name: build-image
      stage: build
      rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH

  - component: $CI_SERVER_FQDN/cicd/templates/release@1.3.0
    inputs:
      gitops_path: apps/delivery
      environment_name: production
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: manual
          allow_failure: true

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
