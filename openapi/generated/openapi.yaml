  /orders/{orderId}/cancel:
    post:
      operationId: Orders_cancel
      description: Клиент-владелец отменяет только CREATED; владелец ресторана заказа — CREATED, COOKING, READY. Переход в CANCELLED освобождает назначенного курьера. DELIVERED/CANCELLED конечны. Назначенный курьер отменять не может
