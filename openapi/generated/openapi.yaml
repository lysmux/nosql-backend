components:
  parameters:
    Pagination.page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      explode: false
    Pagination.size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
  schemas:
    ActorType:
      type: string
      enum:
        - USER
        - RESTAURANT
        - SYSTEM
    BadRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: 'Некорректный запрос: тело или параметры не прошли валидацию'
    Conflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Операция конфликтует с текущим состоянием
    CourierModeConflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Нельзя выключить режим курьера при активном назначении
    CourierModeRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    CreateMenuItemRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price:
          $ref: '#/components/schemas/money'
        available:
          type: boolean
          default: true
    CreateOrderRequest:
      type: object
      required:
        - restaurantId
        - items
        - deliveryAddress
      properties:
        restaurantId:
          $ref: '#/components/schemas/uuid'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
          minItems: 1
          maxItems: 100
        deliveryAddress:
          type: string
          minLength: 1
          maxLength: 500
      description: Корзина клиентская. Без userId, courierId, цен и итоговой суммы. Позиции не повторяются и принадлежат одному ресторану; блюда должны быть доступны
    CreateRestaurantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    EmailConflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Email уже зарегистрирован
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - invalid_credentials
        - session_expired
        - forbidden
        - not_found
        - conflict
        - service_unavailable
        - internal_error
    Forbidden:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Недостаточно прав для операции
    InternalError:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Непредвиденная ошибка сервера
    InvalidCredentials:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Неверные email или пароль
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    MenuItem:
      type: object
      required:
        - menuItemId
        - restaurantId
        - name
        - price
        - available
        - createdAt
        - updatedAt
      properties:
        menuItemId:
          $ref: '#/components/schemas/uuid'
        restaurantId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/money'
        available:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotFound:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Объект не найден
    Notification:
      type: object
      required:
        - notificationId
        - userId
        - orderId
        - eventType
        - status
        - text
        - createdAt
      properties:
        notificationId:
          $ref: '#/components/schemas/uuid'
        userId:
          $ref: '#/components/schemas/uuid'
        orderId:
          $ref: '#/components/schemas/uuid'
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    NotificationEventStream:
      type: string
      description: Поток SSE с кадрами NotificationFrame
    NotificationEventType:
      type: string
      enum:
        - ORDER_CREATED
        - ORDER_STATUS_CHANGED
    NotificationEvents:
      $ref: '#/components/schemas/NotificationFrame'
    NotificationFrame:
      type: object
      required:
        - id
        - data
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        data:
          $ref: '#/components/schemas/Notification'
      description: 'Кадр SSE: id совпадает с data.notificationId, имя события notification'
    NotificationPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          format: int32
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    Order:
      type: object
      required:
        - orderId
        - userId
        - restaurantId
        - restaurantName
        - items
        - deliveryAddress
        - totalAmount
        - status
        - courierId
        - createdAt
        - updatedAt
      properties:
        orderId:
          $ref: '#/components/schemas/uuid'
        userId:
          $ref: '#/components/schemas/uuid'
        restaurantId:
          $ref: '#/components/schemas/uuid'
        restaurantName:
          type: string
          description: Снимок названия ресторана на момент оформления
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
          maxItems: 100
        deliveryAddress:
          type: string
        totalAmount:
          $ref: '#/components/schemas/money'
        status:
          $ref: '#/components/schemas/OrderStatus'
        courierId:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
          description: null до назначения и после отмены; сохраняется после доставки
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderDetails:
      type: object
      required:
        - history
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryEntry'
          description: История от первого перехода к последнему
      allOf:
        - $ref: '#/components/schemas/Order'
    OrderItem:
      type: object
      required:
        - menuItemId
        - name
        - unitPrice
        - quantity
        - lineTotal
      properties:
        menuItemId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Название блюда на момент оформления
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/money'
          description: Цена блюда на момент оформления
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        lineTotal:
          $ref: '#/components/schemas/money'
    OrderItemRequest:
      type: object
      required:
        - menuItemId
        - quantity
      properties:
        menuItemId:
          $ref: '#/components/schemas/uuid'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
    OrderItemsConflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Блюдо недоступно или архивировано
    OrderNotFound:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Заказ не существует или недоступен текущему аккаунту
    OrderPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          format: int32
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    OrderScope:
      type: string
      enum:
        - CUSTOMER
        - RESTAURANT
        - COURIER
    OrderSortField:
      type: string
      enum:
        - CREATED_AT
        - UPDATED_AT
        - TOTAL_AMOUNT
        - STATUS
    OrderStatus:
      type: string
      enum:
        - CREATED
        - COOKING
        - READY
        - IN_DELIVERY
        - DELIVERED
        - CANCELLED
    OrderStatusConflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Недопустимый переход из текущего статуса заказа
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: '#/components/schemas/email'
        password:
          $ref: '#/components/schemas/password'
    Restaurant:
      type: object
      required:
        - restaurantId
        - name
        - createdAt
      properties:
        restaurantId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      description: Публичные сведения; email отсутствует
    RestaurantPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        page:
          type: integer
          format: int32
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    RestaurantVisitCounter:
      type: object
      required:
        - restaurantId
        - value
      properties:
        restaurantId:
          $ref: '#/components/schemas/uuid'
        value:
          type: integer
          format: int64
          minimum: 0
      description: Счётчик просмотров страницы ресторана для аналитики; считает просмотры, а не уникальных посетителей
    ServiceUnavailable:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Хранилище временно недоступно
    Session:
      type: object
      required:
        - userId
        - expiresAt
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
        expiresAt:
          type: string
          format: date-time
      description: Токен передаётся только в HttpOnly cookie, не в теле ответа. Сессия истекает после 30 минут бездействия
    SortDirection:
      type: string
      enum:
        - ASC
        - DESC
    StatusHistoryEntry:
      type: object
      required:
        - fromStatus
        - toStatus
        - actorType
        - actorId
        - reason
        - createdAt
      properties:
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          nullable: true
        toStatus:
          $ref: '#/components/schemas/OrderStatus'
        actorType:
          $ref: '#/components/schemas/ActorType'
        actorId:
          type: string
          allOf:
            - $ref: '#/components/schemas/uuid'
          nullable: true
          description: null только для SYSTEM
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    Unauthorized:
      type: object
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
      description: Требуется действующая сессия
    UpdateMenuItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        price:
          $ref: '#/components/schemas/money'
        available:
          type: boolean
      description: Хотя бы одно поле обязательно. description=null удаляет описание
      minProperties: 1
    UpdateRestaurantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    User:
      type: object
      required:
        - userId
        - name
        - email
        - courierModeEnabled
        - createdAt
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        email:
          $ref: '#/components/schemas/email'
        courierModeEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    email:
      type: string
      maxLength: 254
      format: email
    money:
      type: number
      format: decimal
      minimum: 0
      maximum: 999999999.99
      description: Сумма в рублях; не более двух знаков после запятой
      multipleOf: 0.01
    password:
      type: string
      minLength: 8
      maxLength: 128
      format: password
    uuid:
      type: string
      format: uuid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: session_token
servers:
  - url: http://localhost:8080
    description: Локальный запуск
    variables: {}
