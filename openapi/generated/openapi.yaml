openapi: 3.0.0
info:
  title: Сервис доставки еды
  version: 1.0.0
tags:
  - name: Аутентификация
  - name: Личный кабинет
  - name: Рестораны
  - name: Меню
  - name: Заказы
  - name: Уведомления
paths:
  /auth/login:
    post:
      operationId: Auth_login
      description: 'Вход пользователя по email и паролю: создаёт сессию и ставит cookie session_token. Успешный защищённый запрос продлевает TTL сессии до 30 минут'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: 'Некорректный запрос: тело или параметры не прошли валидацию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Неверные email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentials'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Аутентификация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
        - {}
  /auth/logout:
    post:
      operationId: Auth_logout
      description: Удаляет текущую сессию и сбрасывает cookie
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        '401':
          description: Требуется действующая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Недостаточно прав для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Аутентификация
  /auth/register:
    post:
      operationId: Auth_register
      description: Регистрация пользователя без автоматического входа. Email нормализуется (trim/lowercase) и уникален. courierModeEnabled=false
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '400':
          description: 'Некорректный запрос: тело или параметры не прошли валидацию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailConflict'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Аутентификация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security:
        - {}
  /notifications:
    get:
      operationId: Notifications_feed
      description: 'Только пользователь: своя сохранённая лента, createdAt DESC, notificationId DESC. Нет признака/операции прочтения. После обрыва SSE клиент перечитывает ленту и объединяет по notificationId'
      parameters:
        - $ref: '#/components/parameters/Pagination.page'
        - $ref: '#/components/parameters/Pagination.size'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: 'Некорректный запрос: тело или параметры не прошли валидацию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Требуется действующая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Недостаточно прав для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Уведомления
  /notifications/stream:
    get:
      operationId: Notifications_stream
      description: |-
        Только пользователь. Проверяется cookie session_token.
        Новые уведомления доставляются событием notification: id=notificationId, data=JSON Notification.
        Поток доставляет только живые события; Last-Event-ID не обеспечивает replay и не используется для восстановления.
        После переподключения читать GET /notifications; дедупликация по notificationId.
        Комментарии heartbeat отправляются раз в 15 секунд и не продлевают сессию.
        При выходе или истечении сессии поток закрывается; повторное подключение отклоняется.
        Ошибки JSON возможны только до открытия потока; при сбое открытый поток закрывается
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/NotificationEventStream'
        '401':
          description: Требуется действующая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Недостаточно прав для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Уведомления
  /orders:
    post:
      operationId: Orders_create
      description: Только пользователь. Проверяет доступность блюд, считает итоговую сумму и создаёт заказ в статусе CREATED
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '400':
          description: 'Некорректный запрос: тело или параметры не прошли валидацию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Требуется действующая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Недостаточно прав для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Блюдо недоступно или архивировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemsConflict'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Заказы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
    get:
      operationId: Orders_list
      description: 'scope обязателен: CUSTOMER — свои покупки; RESTAURANT — заказы моих ресторанов (опционально фильтр restaurantId); COURIER — мои назначения. Фильтр status; поиск по вложенным полям: itemName — часть названия позиции без учёта регистра, menuItemId — есть позиция с этим блюдом, cancelledBy — заказ отменён этим актором (по истории). Фильтры сочетаются через И. sortBy — поле сортировки, sortDirection — направление; по умолчанию createdAt по убыванию, при равенстве orderId в том же направлении'
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OrderScope'
          explode: false
        - name: restaurantId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
          explode: false
        - name: itemName
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          explode: false
        - name: menuItemId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/uuid'
          explode: false
        - name: cancelledBy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActorType'
          explode: false
        - name: sortBy
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/OrderSortField'
            default: CREATED_AT
          explode: false
        - name: sortDirection
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/SortDirection'
            default: DESC
          explode: false
        - $ref: '#/components/parameters/Pagination.page'
        - $ref: '#/components/parameters/Pagination.size'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: 'Некорректный запрос: тело или параметры не прошли валидацию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Требуется действующая сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Недостаточно прав для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Заказ не существует или недоступен текущему аккаунту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotFound'
        '500':
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
        '503':
          description: Хранилище временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      tags:
        - Заказы
